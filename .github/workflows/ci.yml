name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
        # macos-15-intel = x86_64, macos-latest = ARM64 (Apple Silicon)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 13

      - name: Install fpm (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -LO https://github.com/fortran-lang/fpm/releases/download/v0.10.1/fpm-0.10.1-linux-x86_64
          chmod +x fpm-0.10.1-linux-x86_64
          sudo mv fpm-0.10.1-linux-x86_64 /usr/local/bin/fpm

      - name: Install fpm (macOS)
        if: runner.os == 'macOS'
        run: brew install fpm

      - name: Install fpm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/fortran-lang/fpm/releases/download/v0.10.1/fpm-0.10.1-windows-x86_64.exe" -OutFile "C:\Windows\fpm.exe"

      - name: Build
        run: fpm build

      - name: Test
        run: fpm test
